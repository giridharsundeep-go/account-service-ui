<gp-workspace-shell
  current="professy"
  [user]="user"
  [token]="sharedToken"
  [projects]="projectContext.projects()"
  [projectId]="projectContext.selectedProjectId()"
  [attr.active-page]="activeMenu"
  custom-notifications
  search-placeholder="Search by title, key, or person"
  (gp-navigate)="setActive($any($event).detail)"
  (gp-project-change)="selectGlobalProject($any($event).detail)"
  (gp-search-input)="onSharedSearchInput($any($event).detail)"
  (gp-search)="openFirstGlobalWorkItem()"
  (gp-create)="openCreateMenu()"
  (gp-signout)="logout()">
  <div slot="search-suggestions" class="global-work-search-popover" *ngIf="globalWorkSearchOpen" role="listbox" aria-label="Work item suggestions">
          <ng-container *ngIf="!globalWorkSearch.trim()"><div class="global-work-search-heading">Recently opened or worked on</div><button type="button" class="global-work-search-result" *ngFor="let item of searchRecent" (click)="openRecent(item)"><span class="global-project-avatar" [attr.data-tone]="avatarTone(item.id)">{{item.type[0]}}</span><span class="global-work-result-copy"><strong>{{item.title}}</strong><span>{{item.key}} · {{item.action || 'Opened'}}</span></span></button><p class="global-work-search-state" *ngIf="!searchRecent.length">Your recently opened or updated work will appear here.</p></ng-container><ng-container *ngIf="globalWorkSearch.trim()"><div class="global-work-search-heading">
            <span>Work items</span>
            <span *ngIf="projectContext.selectedProject() as project">in {{ project.name }}</span>
          </div>
          <div class="global-work-search-state" *ngIf="globalWorkSearchLoading">Searching this project…</div>
          <button
            *ngFor="let item of filteredGlobalWorkItems; trackBy: trackGlobalWorkItem"
            type="button"
            class="global-work-search-result"
            role="option"
            (click)="openGlobalWorkItem(item)">
            <span class="global-work-type-icon" [ngClass]="'type-' + item.type.toLowerCase()">{{ item.type === 'ISSUE' ? '!' : item.type[0] }}</span>
            <span class="global-work-result-copy"><strong>{{ item.key }}</strong><span [title]="item.title">{{ item.title }}</span></span>
            <span class="global-work-result-type">{{ item.typeLabel }}</span>
          </button>
          <div class="global-work-search-heading" *ngIf="filteredGlobalPeople.length">People</div><button type="button" class="global-work-search-result" *ngFor="let person of filteredGlobalPeople" (click)="openSearchPerson(person)"><span class="global-project-avatar">{{person.name.slice(0,1)}}</span><span class="global-work-result-copy"><strong>{{person.name}}</strong><span>{{person.designation || person.email}}</span></span><span>Profile</span></button><div class="global-work-search-state" *ngIf="!globalWorkSearchLoading && !filteredGlobalWorkItems.length && !filteredGlobalPeople.length">No matching titles, keys, or people.</div></ng-container>
        </div>
    <!-- CREATE MENU -->
        <div slot="create-menu"
          *ngIf="createMenuOpen"
          class="popover create-popover">

          <div class="popover-title">
            Create
          </div>


          <button
            *ngFor="let item of createItems"
            type="button"
            class="popover-item"
            (click)="onCreateItem(item.id)">

            <span class="popover-icon">

              <!-- EPIC -->
              <svg
                *ngIf="item.icon === 'epics'"
                viewBox="0 0 24 24">

                <path d="M4 5h16v14H4z"></path>
                <path d="M8 9h8"></path>
                <path d="M8 13h5"></path>

              </svg>


              <!-- STORY -->
              <svg
                *ngIf="item.icon === 'story'"
                viewBox="0 0 24 24">

                <path d="M5 4h14v16H5z"></path>
                <path d="M8 8h8"></path>
                <path d="M8 12h8"></path>
                <path d="M8 16h5"></path>

              </svg>


              <!-- TASK -->
              <svg
                *ngIf="item.icon === 'task'"
                viewBox="0 0 24 24">

                <path d="M5 5h14v14H5z"></path>
                <path d="M8 12l3 3 5-6"></path>

              </svg>

              <!-- ISSUE -->
              <svg *ngIf="item.icon === 'issues'" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="9"></circle>
                <path d="M12 7v6M12 17h.01"></path>
              </svg>


              <!-- TEST CASE -->
              <svg
                *ngIf="item.icon === 'tests'"
                viewBox="0 0 24 24">

                <path d="M4 5h16v14H4z"></path>
                <path d="M7 9l2 2 4-4"></path>
                <path d="M7 15h8"></path>

              </svg>


              <!-- RELEASE -->
              <svg
                *ngIf="item.icon === 'releases'"
                viewBox="0 0 24 24">

                <path d="M5 19L19 5"></path>
                <path d="M9 5h10v10"></path>

              </svg>

            </span>

            <span>
              Create {{ item.label }}
            </span>

          </button>

        </div>
  <app-notification-center slot="header-actions-extra"></app-notification-center>
  <div slot="header-actions-extra" class="header-recent" (click)="$event.stopPropagation()">
        <button type="button" class="icon-button" aria-label="Recent activity" title="Recently opened or worked on" [attr.aria-expanded]="recentMenuOpen" (click)="recentMenuOpen = !recentMenuOpen">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
        </button>
        <section *ngIf="recentMenuOpen" class="header-recent-popover" aria-label="Your recent activity">
          <header><div><strong>Your recent work</strong><span>Opened or updated by you</span></div><button type="button" aria-label="Close recent activity" (click)="recentMenuOpen=false">×</button></header>
          <div class="header-recent-list"><button type="button" *ngFor="let item of recentWork.items()" (click)="openRecent(item)"><span class="global-project-avatar" [attr.data-tone]="avatarTone(item.id)">{{item.type[0]}}</span><span><strong>{{item.title}}</strong><small>{{item.key}} · {{item.action || 'Opened'}} · {{item.openedAt | date:'short'}}</small></span></button><p *ngIf="!recentWork.items().length">Your recent work will appear here.</p></div>
        </section>
      </div>
  <div class="app-shell">
    <section class="main">
      <main class="content">
        <ng-container
          *ngIf="!isViewerRoute()">

          <app-dashboard
            *ngIf="activeMenu === 'dashboard'">
          </app-dashboard>


          <app-roles
            *ngIf="activeMenu === 'roles'">
          </app-roles>

          <app-users
            *ngIf="activeMenu === 'users'"
            [currentUserProfileId]="currentUserProfileId"
            [profileOpenRequest]="profileOpenRequest">
          </app-users>

          <app-teams
            *ngIf="activeMenu === 'teams'">
          </app-teams>

          <app-products
            *ngIf="activeMenu === 'products'">
          </app-products>

          <app-projects
            *ngIf="activeMenu === 'projects'">
          </app-projects>

          <app-boards
            *ngIf="activeMenu === 'boards'">
          </app-boards>

          <app-kanban-board
            *ngIf="activeMenu === 'kanban-board'">
          </app-kanban-board>

          <app-retrospectives *ngIf="activeMenu === 'retrospectives'"></app-retrospectives>
          <app-roadmap *ngIf="activeMenu === 'roadmap'"></app-roadmap>
          <app-agents *ngIf="activeMenu === 'agents'"></app-agents>
          <app-sprint-planning
            *ngIf="activeMenu === 'sprint-planning'">
          </app-sprint-planning>



          <app-work-items
            *ngIf="activeMenu === 'work-items'">
          </app-work-items>

          <app-testcases
            *ngIf="activeMenu === 'test-cases'">
          </app-testcases>

          <app-issues
            *ngIf="activeMenu === 'issues'">
          </app-issues>

          <app-releases
            *ngIf="activeMenu === 'releases'">
          </app-releases>


          <app-suite-frame *ngIf="activeMenu === 'docs'" app="documents" [projectId]="projectContext.selectedProjectId()"></app-suite-frame>
          <app-suite-frame *ngIf="activeMenu === 'chatly'" app="chatly" [projectId]="projectContext.selectedProjectId()"></app-suite-frame>
          <app-suite-frame *ngIf="['sheets','slides','meetings'].includes(activeMenu)" [app]="activeMenu"></app-suite-frame>
          <app-suite-frame *ngIf="activeMenu === 'calendar'" app="calendar" [projectId]="projectContext.selectedProjectId()"></app-suite-frame>

        </ng-container>


        <!-- ROUTER -->
        <router-outlet></router-outlet>

      </main>
    </section>
  </div>
  <div gpFullscreenDialogHost><app-kanban-board *ngIf="itemDialog.request() as request" [dialogRequest]="request" (dialogClosed)="itemDialog.close()"></app-kanban-board></div>
</gp-workspace-shell>
