<div
  class="app-shell"
  [class.nav-collapsed]="isCollapsed">

  <!-- =========================================================
       TOP HEADER
  ========================================================== -->

  <header class="app-header">

    <!-- LEFT HEADER -->
    <div class="header-left">

      <!-- MENU -->
      <button
        type="button"
        class="icon-button menu-button"
        (click)="toggleSidebar()"
        [attr.aria-label]="
          isCollapsed
            ? 'Expand navigation'
            : 'Collapse navigation'
        "
        title="Toggle navigation">

        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 6h18"></path>
          <path d="M3 12h18"></path>
          <path d="M3 18h18"></path>
        </svg>

      </button>

      <!-- BRAND -->
      <div class="brand">
        <h2 style="font-size: 20px;">Greatley Poshley</h2>
        <!--img
          src="assets/images/greatley-poshley.svg"
          alt="Greatley Poshley"
          style="width:44px;height:44px;object-fit:contain;display:block;margin-right:10px;"
        /-->

        <div style="display:flex;flex-direction:column;justify-content:center;line-height:1;">
         
        
        </div>
      </div>

    </div>


    <!-- =======================================================
         SEARCH
    ======================================================== -->

    <div class="search-area">
      <div class="global-project-picker" (click)="$event.stopPropagation()">
        <button type="button" class="global-project-trigger" [class.is-open]="globalProjectMenuOpen" [attr.aria-expanded]="globalProjectMenuOpen" aria-haspopup="listbox" aria-label="Choose project or space" (click)="globalProjectMenuOpen = !globalProjectMenuOpen">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 6.5h6l2 2H20a1.5 1.5 0 0 1 1.5 1.5v7.8a1.7 1.7 0 0 1-1.7 1.7H4.2a1.7 1.7 0 0 1-1.7-1.7V8.2a1.7 1.7 0 0 1 1-1.7Z"></path></svg>
          <span class="global-project-caption">Project / Space</span>
          <strong [title]="globalProjectName">{{ globalProjectName }}</strong>
          <svg class="global-project-chevron" viewBox="0 0 20 20" aria-hidden="true"><path d="m5 7.5 5 5 5-5"></path></svg>
        </button>
        <div class="global-project-popover" *ngIf="globalProjectMenuOpen" role="dialog" aria-label="Select a project or space">
          <label class="global-project-search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"></circle><path d="m16 16 4.5 4.5"></path></svg><input type="search" [(ngModel)]="globalProjectSearch" placeholder="Search projects" aria-label="Search projects"></label>
          <div class="global-project-list" role="listbox" aria-label="Projects and spaces">
            <button type="button" *ngFor="let project of filteredGlobalProjects" role="option" [attr.aria-selected]="project.id === projectContext.selectedProjectId()" [class.is-selected]="project.id === projectContext.selectedProjectId()" (click)="selectGlobalProject(project.id)">
              <img *ngIf="project.avatarUrl" [src]="project.avatarUrl" alt="">
              <span *ngIf="!project.avatarUrl" class="global-project-avatar">{{ project.name.slice(0, 1).toUpperCase() }}</span>
              <strong [title]="project.name">{{ project.name }}</strong>
              <svg *ngIf="project.id === projectContext.selectedProjectId()" viewBox="0 0 16 16" aria-hidden="true"><path d="m3 8 3 3 7-7"></path></svg>
            </button>
            <div class="global-project-empty" *ngIf="!filteredGlobalProjects.length">No matching projects.</div>
          </div>
        </div>
      </div>

      <div class="global-work-search" (click)="$event.stopPropagation()">
        <label class="global-work-search-field" [class.is-open]="globalWorkSearchOpen">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"></circle><path d="m16 16 4.5 4.5"></path></svg>
          <input
            #globalWorkSearchInput
            class="global-work-search-input"
            type="search"
            [(ngModel)]="globalWorkSearch"
            (focus)="globalWorkSearchOpen = true"
            (ngModelChange)="globalWorkSearchOpen = true"
            (keydown.enter)="openFirstGlobalWorkItem()"
            placeholder="Search Epics, Stories, Tasks, Issues"
            aria-label="Search work items" />
          <button *ngIf="globalWorkSearch" type="button" class="global-work-search-clear" aria-label="Clear search" (click)="clearGlobalWorkSearch()">×</button>
          <kbd *ngIf="!globalWorkSearch">⌘ K</kbd>
        </label>
        <div class="global-work-search-popover" *ngIf="globalWorkSearchOpen && globalWorkSearch.trim().length >= 2" role="listbox" aria-label="Work item suggestions">
          <div class="global-work-search-heading">
            <span>Work items</span>
            <span *ngIf="projectContext.selectedProject() as project">in {{ project.name }}</span>
          </div>
          <div class="global-work-search-state" *ngIf="globalWorkSearchLoading">Searching this project…</div>
          <button
            *ngFor="let item of filteredGlobalWorkItems; trackBy: trackGlobalWorkItem"
            type="button"
            class="global-work-search-result"
            role="option"
            (click)="openGlobalWorkItem(item)">
            <span class="global-work-type-icon" [ngClass]="'type-' + item.type.toLowerCase()">{{ item.type === 'ISSUE' ? '!' : item.type[0] }}</span>
            <span class="global-work-result-copy"><strong>{{ item.key }}</strong><span [title]="item.title">{{ item.title }}</span></span>
            <span class="global-work-result-type">{{ item.typeLabel }}</span>
          </button>
          <div class="global-work-search-state" *ngIf="!globalWorkSearchLoading && !filteredGlobalWorkItems.length">No matching work items in this project.</div>
        </div>
      </div>
    </div>


    <!-- =======================================================
         RIGHT HEADER
    ======================================================== -->

    <div class="header-right">

      <!-- CREATE -->
      <div class="create-wrapper">

        <button
          type="button"
          class="header-create-button"
          [class.open]="createMenuOpen"
          (click)="toggleCreateMenu($event)">

          <svg viewBox="0 0 24 24">
            <path d="M12 5v14"></path>
            <path d="M5 12h14"></path>
          </svg>

          <span class="desktop-label">
            Create
          </span>

          <svg
            class="create-chevron"
            viewBox="0 0 24 24">

            <path d="M7 10l5 5 5-5"></path>

          </svg>

        </button>


        <!-- CREATE MENU -->
        <div
          *ngIf="createMenuOpen"
          class="popover create-popover">

          <div class="popover-title">
            Create
          </div>


          <button
            *ngFor="let item of createItems"
            type="button"
            class="popover-item"
            (click)="onCreateItem(item.id)">

            <span class="popover-icon">

              <!-- EPIC -->
              <svg
                *ngIf="item.icon === 'epics'"
                viewBox="0 0 24 24">

                <path d="M4 5h16v14H4z"></path>
                <path d="M8 9h8"></path>
                <path d="M8 13h5"></path>

              </svg>


              <!-- STORY -->
              <svg
                *ngIf="item.icon === 'story'"
                viewBox="0 0 24 24">

                <path d="M5 4h14v16H5z"></path>
                <path d="M8 8h8"></path>
                <path d="M8 12h8"></path>
                <path d="M8 16h5"></path>

              </svg>


              <!-- TASK -->
              <svg
                *ngIf="item.icon === 'task'"
                viewBox="0 0 24 24">

                <path d="M5 5h14v14H5z"></path>
                <path d="M8 12l3 3 5-6"></path>

              </svg>

              <!-- ISSUE -->
              <svg *ngIf="item.icon === 'issues'" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="9"></circle>
                <path d="M12 7v6M12 17h.01"></path>
              </svg>


              <!-- TEST CASE -->
              <svg
                *ngIf="item.icon === 'tests'"
                viewBox="0 0 24 24">

                <path d="M4 5h16v14H4z"></path>
                <path d="M7 9l2 2 4-4"></path>
                <path d="M7 15h8"></path>

              </svg>


              <!-- RELEASE -->
              <svg
                *ngIf="item.icon === 'releases'"
                viewBox="0 0 24 24">

                <path d="M5 19L19 5"></path>
                <path d="M9 5h10v10"></path>

              </svg>

            </span>

            <span>
              Create {{ item.label }}
            </span>

          </button>

        </div>

      </div>


      <!-- HELP -->
      <button
        type="button"
        class="icon-button desktop-only"
        title="Help"
        aria-label="Help">

        <svg viewBox="0 0 24 24">

          <circle
            cx="12"
            cy="12"
            r="9">
          </circle>

          <path
            d="M9.8 9a2.3 2.3 0 1 1 3.9 1.6c-1 .9-1.7 1.2-1.7 2.7">
          </path>

          <path d="M12 17h.01"></path>

        </svg>

      </button>


      <!-- SETTINGS -->
      <button
        type="button"
        class="icon-button desktop-only"
        title="Settings"
        aria-label="Settings">

        <svg viewBox="0 0 24 24">

          <circle
            cx="12"
            cy="12"
            r="3.5">
          </circle>

          <path
            d="M19 15l1 1-2 2-1-1
               a7 7 0 0 1-2 1v2h-3v-2
               a7 7 0 0 1-2-1l-1 1-2-2
               1-1a7 7 0 0 1-1-2H4v-3h2
               a7 7 0 0 1 1-2L6 7l2-2
               1 1a7 7 0 0 1 2-1V3h3v2
               a7 7 0 0 1 2 1l1-1 2 2-1 1
               a7 7 0 0 1 1 2h2v3h-2
               a7 7 0 0 1-1 2z">
          </path>

        </svg>

      </button>


      <!-- PROFILE -->
      <div class="profile-wrapper">

        <button
          type="button"
          class="profile-button"
          (click)="toggleProfileMenu($event)"
          aria-label="Account">

          <span class="profile-avatar">
            {{ userInitials }}
          </span>

        </button>


        <!-- PROFILE POPUP -->
        <div
          *ngIf="profileMenuOpen"
          class="popover profile-popover">

          <div class="profile-card">

            <div class="profile-avatar profile-large">
              {{ userInitials }}
            </div>

            <strong>
              {{ user.name }}
            </strong>

            <span>
              {{ user.email }}
            </span>

          </div>


          <div class="popover-divider"></div>


          <button
            type="button"
            class="popover-item"
            (click)="openEditDialog()">

            <span class="popover-icon">

              <svg viewBox="0 0 24 24">

                <circle
                  cx="12"
                  cy="8"
                  r="4">
                </circle>

                <path
                  d="M4 21a8 8 0 0 1 16 0">
                </path>

              </svg>

            </span>

            Edit profile

          </button>


          <button
            type="button"
            class="popover-item"
            (click)="setActive('dashboard')">

            <span class="popover-icon">

              <svg viewBox="0 0 24 24">

                <path d="M4 4h7v7H4z"></path>
                <path d="M13 4h7v7h-7z"></path>
                <path d="M4 13h7v7H4z"></path>
                <path d="M13 13h7v7h-7z"></path>

              </svg>

            </span>

            My Dashboard

          </button>


          <div class="popover-divider"></div>


          <button
            type="button"
            class="popover-item danger"
            (click)="logout()">

            <span class="popover-icon">

              <svg viewBox="0 0 24 24">

                <path d="M10 4H5v16h5"></path>
                <path d="M14 8l4 4-4 4"></path>
                <path d="M8 12h10"></path>

              </svg>

            </span>

            Sign out

          </button>

        </div>

      </div>

    </div>

  </header>


  <!-- =========================================================
       APPLICATION BODY
  ========================================================== -->

  <div class="app-body">


    <!-- =======================================================
         SIDEBAR
    ======================================================== -->

    <aside
      class="sidebar"
      [class.collapsed]="isCollapsed">


      <!-- CREATE -->
      <div class="sidebar-create">

        <button
          type="button"
          class="sidebar-create-button"
          [class.open]="createMenuOpen"
          (click)="toggleCreateMenu($event)">

          <svg viewBox="0 0 24 24">

            <path d="M12 5v14"></path>
            <path d="M5 12h14"></path>

          </svg>

          <span *ngIf="!isCollapsed">
            Create
          </span>

        </button>

      </div>


      <!-- =====================================================
           NAVIGATION
      ====================================================== -->

      <nav class="navigation" aria-label="Main navigation">
        <ng-container *ngTemplateOutlet="navigationGroup; context: { title: '', items: primaryNavigation, first: true }"></ng-container>
        <ng-container *ngTemplateOutlet="navigationGroup; context: { title: 'Plan & Track', items: planningNavigation }"></ng-container>
        <ng-container *ngTemplateOutlet="navigationGroup; context: { title: 'Quality', items: qualityNavigation }"></ng-container>
        <ng-container *ngTemplateOutlet="navigationGroup; context: { title: 'Delivery', items: deliveryNavigation }"></ng-container>
        <ng-container *ngTemplateOutlet="navigationGroup; context: { title: 'Knowledge', items: knowledgeNavigation }"></ng-container>
        <ng-container *ngTemplateOutlet="navigationGroup; context: { title: 'People & Access', items: peopleNavigation }"></ng-container>

        <ng-template #navigationGroup let-title="title" let-items="items" let-first="first">
          <div class="navigation-section" *ngIf="title && !isCollapsed">{{ title }}</div>
          <div class="navigation-divider" *ngIf="title && isCollapsed"></div>
          <button *ngFor="let item of items" type="button" class="nav-item"
            [class.active]="isActive(item.id)" [class.collapsed-item]="isCollapsed"
            (click)="setActive(item.id)" [attr.title]="isCollapsed ? item.label : null">
            <span class="nav-icon">
            <svg *ngIf="item.icon === 'dashboard'" viewBox="0 0 24 24"><path d="M4 4h7v7H4z"></path><path d="M13 4h7v7h-7z"></path><path d="M4 13h7v7H4z"></path><path d="M13 13h7v7h-7z"></path></svg>
            <svg *ngIf="item.icon === 'products'" viewBox="0 0 24 24"><path d="M4 7l8-4 8 4-8 4z"></path><path d="M4 7v10l8 4 8-4V7"></path><path d="M12 11v10"></path></svg>
            <svg *ngIf="item.icon === 'projects'" viewBox="0 0 24 24"><path d="M3 6h7l2 2h9v11H3z"></path></svg>
            <svg *ngIf="item.icon === 'boards' || item.icon === 'kanban'" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M9 4v16M15 4v16"></path></svg>
            <svg *ngIf="item.icon === 'sprint'" viewBox="0 0 24 24"><path d="M4 5h16M4 12h10M4 19h7"></path><path d="M17 9l3 3-3 3M20 12h-7"></path></svg>
            <svg *ngIf="item.icon === 'work-items'" viewBox="0 0 24 24"><path d="M4 5h16M4 12h16M4 19h16"></path><path d="M8 5v14M20 5v14"></path></svg>
            <svg *ngIf="item.icon === 'tests'" viewBox="0 0 24 24"><path d="M4 5h16v14H4z"></path><path d="M7 9l2 2 4-4M7 15h8"></path></svg>
            <svg *ngIf="item.icon === 'issues'" viewBox="0 0 24 24"><path d="M12 3l9 17H3z"></path><path d="M12 9v5M12 17v.01"></path></svg>
            <svg *ngIf="item.icon === 'releases'" viewBox="0 0 24 24"><path d="M5 19L19 5M9 5h10v10"></path></svg>
            <svg *ngIf="item.icon === 'docs'" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"></path><path d="M15 3v5h4M9 12h6M9 16h6"></path></svg>
            <svg *ngIf="item.icon === 'roles'" viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 5-3.5 8.5-7 10-3.5-1.5-7-5-7-10V6z"></path><path d="M9 12l2 2 4-4"></path></svg>
            <svg *ngIf="item.icon === 'users'" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"></circle><path d="M5 20a7 7 0 0 1 14 0"></path></svg>
            <svg *ngIf="item.icon === 'teams'" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"></circle><circle cx="17" cy="9" r="2.5"></circle><path d="M3 20a6 6 0 0 1 12 0M15 15a5 5 0 0 1 6 5"></path></svg>
            </span>
            <span class="nav-label" *ngIf="!isCollapsed">{{ item.label }}</span>
          </button>
        </ng-template>
      </nav>


      <!-- =====================================================
           COLLAPSE
      ====================================================== -->

      <div class="sidebar-bottom">

        <button
          type="button"
          class="nav-item collapse-item"
          (click)="toggleSidebar()"
          [attr.title]="
            isCollapsed
              ? 'Expand navigation'
              : 'Collapse navigation'
          ">

          <span class="nav-icon">

            <!-- COLLAPSE -->
            <svg
              *ngIf="!isCollapsed"
              viewBox="0 0 24 24">

              <path d="M15 6l-6 6 6 6"></path>

            </svg>


            <!-- EXPAND -->
            <svg
              *ngIf="isCollapsed"
              viewBox="0 0 24 24">

              <path d="M9 6l6 6-6 6"></path>

            </svg>

          </span>


          <span
            class="nav-label"
            *ngIf="!isCollapsed">

            Collapse navigation

          </span>

        </button>

      </div>

    </aside>


    <!-- =======================================================
         MAIN
    ======================================================== -->

    <section class="main">

      <main class="content">


        <!-- APPLICATION COMPONENTS -->

        <ng-container
          *ngIf="!isViewerRoute()">

          <app-dashboard
            *ngIf="activeMenu === 'dashboard'">
          </app-dashboard>


          <app-roles
            *ngIf="activeMenu === 'roles'">
          </app-roles>

          <app-users
            *ngIf="activeMenu === 'users'">
          </app-users>

          <app-teams
            *ngIf="activeMenu === 'teams'">
          </app-teams>

          <app-products
            *ngIf="activeMenu === 'products'">
          </app-products>

          <app-projects
            *ngIf="activeMenu === 'projects'">
          </app-projects>

          <app-boards
            *ngIf="activeMenu === 'boards'">
          </app-boards>

          <app-kanban-board
            *ngIf="activeMenu === 'kanban-board'">
          </app-kanban-board>

          <app-sprint-planning
            *ngIf="activeMenu === 'sprint-planning'">
          </app-sprint-planning>

          <app-work-items
            *ngIf="activeMenu === 'work-items'">
          </app-work-items>

          <app-testcases
            *ngIf="activeMenu === 'test-cases'">
          </app-testcases>

          <app-issues
            *ngIf="activeMenu === 'issues'">
          </app-issues>

          <app-releases
            *ngIf="activeMenu === 'releases'">
          </app-releases>


          <app-docs
            *ngIf="activeMenu === 'docs'">
          </app-docs>

        </ng-container>


        <!-- ROUTER -->
        <router-outlet></router-outlet>

      </main>


      <!-- =====================================================
           FOOTER
      ====================================================== -->

      <footer class="footer">

        <span>
          © {{ currentYear }} Greatley Poshley Ltd.
        </span>


        <span class="footer-links">

          <a
            href="javascript:void(0)"
            (click)="setActive('docs')">

            Documentation

          </a>

          <span>•</span>

          <a href="javascript:void(0)">
            System Status
          </a>

          <span>•</span>

          <a href="javascript:void(0)">
            Support
          </a>

        </span>

      </footer>

    </section>

  </div>

</div>
