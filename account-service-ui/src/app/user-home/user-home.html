<div
  class="app-shell"
  [class.nav-collapsed]="isCollapsed">

  <!-- =========================================================
       TOP HEADER
  ========================================================== -->

  <header class="app-header">

    <!-- LEFT HEADER -->
    <div class="header-left">

      <!-- MENU -->
      <button
        type="button"
        class="icon-button menu-button"
        (click)="toggleSidebar()"
        [attr.aria-label]="
          isCollapsed
            ? 'Expand navigation'
            : 'Collapse navigation'
        "
        title="Toggle navigation">

        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 6h18"></path>
          <path d="M3 12h18"></path>
          <path d="M3 18h18"></path>
        </svg>

      </button>

      <!-- BRAND -->
      <div class="brand">
        <h2 style="font-size: 20px;">Greatley Poshley</h2>
        <!--img
          src="assets/images/greatley-poshley.svg"
          alt="Greatley Poshley"
          style="width:44px;height:44px;object-fit:contain;display:block;margin-right:10px;"
        /-->

        <div style="display:flex;flex-direction:column;justify-content:center;line-height:1;">
         
        
        </div>
      </div>

    </div>


    <!-- =======================================================
         SEARCH
    ======================================================== -->

    <div class="search-area">

      <div class="search-box">

        <button
          type="button"
          class="search-button"
          (click)="focusSearch()"
          aria-label="Search">

          <svg viewBox="0 0 24 24">
            <circle
              cx="10.8"
              cy="10.8"
              r="6.8">
            </circle>

            <path d="M16 16l5 5"></path>
          </svg>

        </button>


        <input
          #searchInput
          class="search-input"
          type="text"
          [(ngModel)]="searchQuery"
          placeholder="Search projects, users, teams..."
          autocomplete="off" />


        <button
          *ngIf="searchQuery"
          type="button"
          class="search-clear"
          (click)="clearSearch()"
          aria-label="Clear search">

          <svg viewBox="0 0 24 24">
            <path d="M6 6l12 12"></path>
            <path d="M18 6L6 18"></path>
          </svg>

        </button>


        <span
          *ngIf="!searchQuery"
          class="search-shortcut">

          ⌘ K

        </span>

      </div>

    </div>


    <!-- =======================================================
         RIGHT HEADER
    ======================================================== -->

    <div class="header-right">

      <!-- CREATE -->
      <div class="create-wrapper">

        <button
          type="button"
          class="header-create-button"
          [class.open]="createMenuOpen"
          (click)="toggleCreateMenu($event)">

          <svg viewBox="0 0 24 24">
            <path d="M12 5v14"></path>
            <path d="M5 12h14"></path>
          </svg>

          <span class="desktop-label">
            Create
          </span>

          <svg
            class="create-chevron"
            viewBox="0 0 24 24">

            <path d="M7 10l5 5 5-5"></path>

          </svg>

        </button>


        <!-- CREATE MENU -->
        <div
          *ngIf="createMenuOpen"
          class="popover create-popover">

          <div class="popover-title">
            Create
          </div>


          <button
            *ngFor="let item of createItems"
            type="button"
            class="popover-item"
            (click)="onCreateItem(item.id)">

            <span class="popover-icon">

              <!-- EPIC -->
              <svg
                *ngIf="item.icon === 'epics'"
                viewBox="0 0 24 24">

                <path d="M4 5h16v14H4z"></path>
                <path d="M8 9h8"></path>
                <path d="M8 13h5"></path>

              </svg>


              <!-- STORY -->
              <svg
                *ngIf="item.icon === 'story'"
                viewBox="0 0 24 24">

                <path d="M5 4h14v16H5z"></path>
                <path d="M8 8h8"></path>
                <path d="M8 12h8"></path>
                <path d="M8 16h5"></path>

              </svg>


              <!-- TASK -->
              <svg
                *ngIf="item.icon === 'task'"
                viewBox="0 0 24 24">

                <path d="M5 5h14v14H5z"></path>
                <path d="M8 12l3 3 5-6"></path>

              </svg>


              <!-- ISSUE -->
              <svg
                *ngIf="item.icon === 'issues'"
                viewBox="0 0 24 24">

                <path d="M12 3l9 17H3z"></path>
                <path d="M12 9v5"></path>
                <path d="M12 17v1"></path>

              </svg>


              <!-- TEST CASE -->
              <svg
                *ngIf="item.icon === 'tests'"
                viewBox="0 0 24 24">

                <path d="M4 5h16v14H4z"></path>
                <path d="M7 9l2 2 4-4"></path>
                <path d="M7 15h8"></path>

              </svg>


              <!-- RELEASE -->
              <svg
                *ngIf="item.icon === 'releases'"
                viewBox="0 0 24 24">

                <path d="M5 19L19 5"></path>
                <path d="M9 5h10v10"></path>

              </svg>

            </span>

            <span>
              Create {{ item.label }}
            </span>

          </button>

        </div>

      </div>


      <!-- HELP -->
      <button
        type="button"
        class="icon-button desktop-only"
        title="Help"
        aria-label="Help">

        <svg viewBox="0 0 24 24">

          <circle
            cx="12"
            cy="12"
            r="9">
          </circle>

          <path
            d="M9.8 9a2.3 2.3 0 1 1 3.9 1.6c-1 .9-1.7 1.2-1.7 2.7">
          </path>

          <path d="M12 17h.01"></path>

        </svg>

      </button>


      <!-- SETTINGS -->
      <button
        type="button"
        class="icon-button desktop-only"
        title="Settings"
        aria-label="Settings">

        <svg viewBox="0 0 24 24">

          <circle
            cx="12"
            cy="12"
            r="3.5">
          </circle>

          <path
            d="M19 15l1 1-2 2-1-1
               a7 7 0 0 1-2 1v2h-3v-2
               a7 7 0 0 1-2-1l-1 1-2-2
               1-1a7 7 0 0 1-1-2H4v-3h2
               a7 7 0 0 1 1-2L6 7l2-2
               1 1a7 7 0 0 1 2-1V3h3v2
               a7 7 0 0 1 2 1l1-1 2 2-1 1
               a7 7 0 0 1 1 2h2v3h-2
               a7 7 0 0 1-1 2z">
          </path>

        </svg>

      </button>


      <!-- PROFILE -->
      <div class="profile-wrapper">

        <button
          type="button"
          class="profile-button"
          (click)="toggleProfileMenu($event)"
          aria-label="Account">

          <span class="profile-avatar">
            {{ userInitials }}
          </span>

        </button>


        <!-- PROFILE POPUP -->
        <div
          *ngIf="profileMenuOpen"
          class="popover profile-popover">

          <div class="profile-card">

            <div class="profile-avatar profile-large">
              {{ userInitials }}
            </div>

            <strong>
              {{ user.name }}
            </strong>

            <span>
              {{ user.email }}
            </span>

          </div>


          <div class="popover-divider"></div>


          <button
            type="button"
            class="popover-item"
            (click)="openEditDialog()">

            <span class="popover-icon">

              <svg viewBox="0 0 24 24">

                <circle
                  cx="12"
                  cy="8"
                  r="4">
                </circle>

                <path
                  d="M4 21a8 8 0 0 1 16 0">
                </path>

              </svg>

            </span>

            Edit profile

          </button>


          <button
            type="button"
            class="popover-item"
            (click)="setActive('dashboard')">

            <span class="popover-icon">

              <svg viewBox="0 0 24 24">

                <path d="M4 4h7v7H4z"></path>
                <path d="M13 4h7v7h-7z"></path>
                <path d="M4 13h7v7H4z"></path>
                <path d="M13 13h7v7h-7z"></path>

              </svg>

            </span>

            My Dashboard

          </button>


          <div class="popover-divider"></div>


          <button
            type="button"
            class="popover-item danger"
            (click)="logout()">

            <span class="popover-icon">

              <svg viewBox="0 0 24 24">

                <path d="M10 4H5v16h5"></path>
                <path d="M14 8l4 4-4 4"></path>
                <path d="M8 12h10"></path>

              </svg>

            </span>

            Sign out

          </button>

        </div>

      </div>

    </div>

  </header>


  <!-- =========================================================
       APPLICATION BODY
  ========================================================== -->

  <div class="app-body">


    <!-- =======================================================
         SIDEBAR
    ======================================================== -->

    <aside
      class="sidebar"
      [class.collapsed]="isCollapsed">


      <!-- CREATE -->
      <div class="sidebar-create">

        <button
          type="button"
          class="sidebar-create-button"
          [class.open]="createMenuOpen"
          (click)="toggleCreateMenu($event)">

          <svg viewBox="0 0 24 24">

            <path d="M12 5v14"></path>
            <path d="M5 12h14"></path>

          </svg>

          <span *ngIf="!isCollapsed">
            Create
          </span>

        </button>

      </div>


      <!-- =====================================================
           NAVIGATION
      ====================================================== -->

      <nav
        class="navigation"
        aria-label="Main navigation">


        <!-- PRIMARY -->
        <button
          *ngFor="let item of primaryNavigation"
          type="button"
          class="nav-item"
          [class.active]="isActive(item.id)"
          [class.collapsed-item]="isCollapsed"
          (click)="setActive(item.id)"
          [attr.title]="isCollapsed ? item.label : null">


          <span class="nav-icon">


            <!-- DASHBOARD -->
            <svg
              *ngIf="item.icon === 'dashboard'"
              viewBox="0 0 24 24">

              <path d="M4 4h7v7H4z"></path>
              <path d="M13 4h7v7h-7z"></path>
              <path d="M4 13h7v7H4z"></path>
              <path d="M13 13h7v7h-7z"></path>

            </svg>


            <!-- PRODUCTS -->
            <svg
              *ngIf="item.icon === 'products'"
              viewBox="0 0 24 24">

              <path d="M4 7l8-4 8 4-8 4z"></path>
              <path d="M4 7v10l8 4 8-4V7"></path>
              <path d="M12 11v10"></path>

            </svg>


            <!-- PROJECTS -->
            <svg
              *ngIf="item.icon === 'projects'"
              viewBox="0 0 24 24">

              <path d="M3 6h7l2 2h9v11H3z"></path>

            </svg>


            <!-- EPICS -->
            <svg
              *ngIf="item.icon === 'epics'"
              viewBox="0 0 24 24">

              <path d="M4 5h16v14H4z"></path>
              <path d="M8 9h8"></path>
              <path d="M8 13h6"></path>

            </svg>


            <!-- TESTS -->
            <svg
              *ngIf="item.icon === 'tests'"
              viewBox="0 0 24 24">

              <path d="M4 5h16v14H4z"></path>
              <path d="M7 9l2 2 4-4"></path>
              <path d="M7 15h8"></path>

            </svg>


            <!-- RELEASES -->
            <svg
              *ngIf="item.icon === 'releases'"
              viewBox="0 0 24 24">

              <path d="M5 19L19 5"></path>
              <path d="M9 5h10v10"></path>

            </svg>


            <!-- DOCS -->
            <svg
              *ngIf="item.icon === 'docs'"
              viewBox="0 0 24 24">

              <path d="M6 3h9l4 4v14H6z"></path>
              <path d="M15 3v5h4"></path>
              <path d="M9 12h6"></path>
              <path d="M9 16h6"></path>

            </svg>

          </span>


          <span
            class="nav-label"
            *ngIf="!isCollapsed">

            {{ item.label }}

          </span>

        </button>


        <!-- ADMINISTRATION -->
        <div
          class="navigation-section"
          *ngIf="!isCollapsed">

          Administration

        </div>


        <div
          class="navigation-divider"
          *ngIf="isCollapsed">
        </div>


        <!-- ADMIN -->
        <button
          *ngFor="let item of administrationNavigation"
          type="button"
          class="nav-item"
          [class.active]="isActive(item.id)"
          [class.collapsed-item]="isCollapsed"
          (click)="setActive(item.id)"
          [attr.title]="isCollapsed ? item.label : null">


          <span class="nav-icon">


            <!-- ROLES -->
            <svg
              *ngIf="item.icon === 'roles'"
              viewBox="0 0 24 24">

              <path
                d="M12 3l7 3v5c0 5-3.5 8.5-7 10
                   -3.5-1.5-7-5-7-10V6z">
              </path>

              <path d="M9 12l2 2 4-4"></path>

            </svg>


            <!-- USERS -->
            <svg
              *ngIf="item.icon === 'users'"
              viewBox="0 0 24 24">

              <circle
                cx="12"
                cy="8"
                r="3.5">
              </circle>

              <path
                d="M5 20a7 7 0 0 1 14 0">
              </path>

            </svg>


            <!-- TEAMS -->
            <svg
              *ngIf="item.icon === 'teams'"
              viewBox="0 0 24 24">

              <circle
                cx="9"
                cy="8"
                r="3">
              </circle>

              <circle
                cx="17"
                cy="9"
                r="2.5">
              </circle>

              <path
                d="M3 20a6 6 0 0 1 12 0">
              </path>

              <path
                d="M15 15a5 5 0 0 1 6 5">
              </path>

            </svg>

          </span>


          <span
            class="nav-label"
            *ngIf="!isCollapsed">

            {{ item.label }}

          </span>

        </button>

      </nav>


      <!-- =====================================================
           COLLAPSE
      ====================================================== -->

      <div class="sidebar-bottom">

        <button
          type="button"
          class="nav-item collapse-item"
          (click)="toggleSidebar()"
          [attr.title]="
            isCollapsed
              ? 'Expand navigation'
              : 'Collapse navigation'
          ">

          <span class="nav-icon">

            <!-- COLLAPSE -->
            <svg
              *ngIf="!isCollapsed"
              viewBox="0 0 24 24">

              <path d="M15 6l-6 6 6 6"></path>

            </svg>


            <!-- EXPAND -->
            <svg
              *ngIf="isCollapsed"
              viewBox="0 0 24 24">

              <path d="M9 6l6 6-6 6"></path>

            </svg>

          </span>


          <span
            class="nav-label"
            *ngIf="!isCollapsed">

            Collapse navigation

          </span>

        </button>

      </div>

    </aside>


    <!-- =======================================================
         MAIN
    ======================================================== -->

    <section class="main">

      <main class="content">


        <!-- APPLICATION COMPONENTS -->

        <ng-container
          *ngIf="!isViewerRoute()">


          <app-dashboard
            *ngIf="activeMenu === 'dashboard'">
          </app-dashboard>


          <app-roles
            *ngIf="activeMenu === 'roles'">
          </app-roles>


          <app-users
            *ngIf="activeMenu === 'users'">
          </app-users>


          <app-teams
            *ngIf="activeMenu === 'teams'">
          </app-teams>


          <app-products
            *ngIf="activeMenu === 'products'">
          </app-products>


          <app-projects
            *ngIf="activeMenu === 'projects'">
          </app-projects>


          <app-epics
            *ngIf="activeMenu === 'epics'">
          </app-epics>

          <app-testcases
            *ngIf="activeMenu === 'test-cases'">
          </app-testcases>


          <app-releases
            *ngIf="activeMenu === 'releases'">
          </app-releases>


          <app-docs
            *ngIf="activeMenu === 'docs'">
          </app-docs>

        </ng-container>


        <!-- ROUTER -->
        <router-outlet></router-outlet>

      </main>


      <!-- =====================================================
           FOOTER
      ====================================================== -->

      <footer class="footer">

        <span>
          © {{ currentYear }} Greatley Poshley Ltd.
        </span>


        <span class="footer-links">

          <a
            href="javascript:void(0)"
            (click)="setActive('docs')">

            Documentation

          </a>

          <span>•</span>

          <a href="javascript:void(0)">
            System Status
          </a>

          <span>•</span>

          <a href="javascript:void(0)">
            Support
          </a>

        </span>

      </footer>

    </section>

  </div>

</div>
