<main class="profile-page">

    <mat-toolbar class="toolbar">
        <span style="color: black;font-weight: bold;font-size: 20px;">Greatley Poshley</span>
        <span class="spacer"></span>

        <button mat-icon-button>
            <mat-icon>settings</mat-icon>
        </button>
    </mat-toolbar>

    <section class="main-layout">

        <aside class="side-panel" style="padding-top: 40px;">

            <div class="side-user">
                <div class="mini-avatar">
                    {{ user.name?.charAt(0) }}
                </div>
                <div>
                    <div class="mini-name">{{ user.name }}</div>
                    <div class="mini-email">{{ user.email }}</div>
                </div>
            </div>

            <div class="side-section">
                <p class="side-title">Applications</p>

                <div class="side-item" [class.active]="activeMenu==='create'" (click)="setActive('create')">
                    <mat-icon>add_business</mat-icon>
                    <span>Organisations</span>
                </div>

                <div class="side-item" [class.active]="activeMenu==='dashboard'" (click)="setActive('dashboard')">
                    <mat-icon>dashboard</mat-icon>
                    <span>Dashboard</span>
                </div>

                <div class="side-item" [class.active]="activeMenu==='roles'" (click)="setActive('roles')">
                    <mat-icon>badge</mat-icon>
                    <span>Roles</span>
                </div>

                <div class="side-item" [class.active]="activeMenu==='users'" (click)="setActive('users')">
                    <mat-icon>person</mat-icon>
                    <span>Users</span>
                </div>

                <div class="side-item" [class.active]="activeMenu==='teams'" (click)="setActive('teams')">
                    <mat-icon>groups</mat-icon>
                    <span>Teams</span>
                </div>

                <div class="side-item" [class.active]="activeMenu==='products'" (click)="setActive('products')">
                    <mat-icon>inventory_2</mat-icon> 
                    <span>Products</span>
                </div>
                <div class="side-item" [class.active]="activeMenu==='projects'" (click)="setActive('projects')">
                    <mat-icon>folder</mat-icon> 
                    <span> Projects</span>
                </div>
<div class="side-item" [class.active]="activeMenu==='backlog'" (click)="setActive('backlog')">
                    <mat-icon>inventory_2</mat-icon> 
                    <span>Backlogs & Epics </span>
                </div>
               
            </div>

        </aside>

        <div class="content-area">
            <app-organisation *ngIf="activeMenu === 'create'"></app-organisation>
            <app-dashboard *ngIf="activeMenu === 'dashboard'"></app-dashboard>
            <app-roles *ngIf="activeMenu === 'roles'"></app-roles>
            <app-users *ngIf="activeMenu === 'users'"></app-users>
            <app-teams *ngIf="activeMenu === 'teams'"></app-teams>
            <app-products *ngIf="activeMenu === 'products'"></app-products>
            <app-projects *ngIf="activeMenu === 'projects'"></app-projects>
            <app-backlog *ngIf="activeMenu === 'backlog'"> </app-backlog>
         </div>

    </section>

</main>
