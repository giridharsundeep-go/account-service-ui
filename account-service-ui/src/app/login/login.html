<main class="main">

  <div class="container">

    <!-- BRAND -->
    <header class="brand">
      <img
        src="assets/images/greatley-poshley.svg"
        alt="Greatley Poshley"
        class="brand-logo"
      />

      <div class="brand-name">Greatley Poshley</div>
    </header>

    <!-- 🧾 LOGIN CARD -->
    <div class="login-card">

      <h2 class="login-title">Welcome</h2>
      <p class="subtitle">Login to continue</p>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

        <!-- EMAIL -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" />

          <mat-error *ngIf="email?.invalid && email?.touched">
            <span *ngIf="email?.hasError('required')">Email is required</span>
            <span *ngIf="email?.hasError('invalidEmail')">Enter valid email</span>
          </mat-error>
        </mat-form-field>

        <!-- PASSWORD -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>

          <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password" />

          <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword">
            <mat-icon>
              {{ hidePassword ? 'visibility' : 'visibility_off' }}
            </mat-icon>
          </button>

          <mat-error *ngIf="password?.invalid && password?.touched">
            Password is required
          </mat-error>
        </mat-form-field>

        <!-- FORGOT -->
        <div class="forgot-container">
          <button mat-button type="button" (click)="goToForgotPassword()">
            Forgot Password?
          </button>
        </div>

        <!-- ERROR -->
        <div class="error" *ngIf="errorMessage">
          {{ errorMessage }}
        </div>

        <!-- LOGIN -->
        <button mat-raised-button class="continue-button" type="submit">
          Continue
        </button>

      </form>

      <div class="divider-text">Don't have an account?</div>

      <!-- CREATE -->
      <button class="create-account-button" (click)="goToCreateAccount()">
        Create an Account
      </button>

    </div>

  </div>

  <!-- 🦶 FOOTER -->
  <footer class="login-footer">
    <div class="footer-links">
      <a href="/privacy-policy">Privacy Policy</a>
      <span class="dot">•</span>
      <a href="/terms">Terms of Service</a>
      <span class="dot">•</span>
      <a href="/help">Help Center</a>
    </div>
    <p class="copyright">© 2026 Greatley Poshley. All rights reserved.</p>
  </footer>

</main>
