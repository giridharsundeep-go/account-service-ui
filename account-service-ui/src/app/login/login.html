<main class="sign-in-bridge" aria-labelledby="sign-in-heading">
  <span class="brand-mark" aria-hidden="true">g<span>p</span></span>
  <p class="eyebrow">GREATLEY POSHLEY</p>
  <h1 id="sign-in-heading">One account. Connected work.</h1>
  <p>Opening your shared sign-in for Professy, Chatly, Documents, and Calendar.</p>
  <p *ngIf="error" class="error" role="alert">{{ error }}</p>
  <button type="button" [disabled]="busy" (click)="signIn()">{{ busy ? 'Opening sign-in…' : 'Continue to sign-in' }}</button>
</main>
