apiVersion: v1
kind: Namespace
metadata:
  name: professy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: build-center-deployer
  namespace: professy
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, patch]
  - apiGroups: [apps]
    resources: [deployments/scale]
    verbs: [get, patch, update]
  - apiGroups: [""]
    resources: [services]
    verbs: [get, create, patch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, patch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, create, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, create, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: build-center-deployer
  namespace: professy
subjects:
  - kind: Group
    name: build-center-professy-deployer
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: build-center-deployer
  apiGroup: rbac.authorization.k8s.io
