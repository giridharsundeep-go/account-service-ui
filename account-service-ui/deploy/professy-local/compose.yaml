name: professy-local

x-professy-image: &professy-image professy-backend:build-8b10f4aa-9e74-4f78-ab76-a659f80e867a

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: professy
      MYSQL_USER: professy
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP -h 127.0.0.1 -u "$${MYSQL_USER}" "$${MYSQL_DATABASE}" -Nse 'SELECT 1' >/dev/null
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  kafka:
    image: apache/kafka:4.2.2
    restart: unless-stopped
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?Set KAFKA_CLUSTER_ID in .env}
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: "1"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    volumes:
      - kafka:/var/lib/kafka/data
    healthcheck:
      test: [CMD, /opt/kafka/bin/kafka-broker-api-versions.sh, --bootstrap-server, "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  storage-init:
    image: *professy-image
    pull_policy: never
    user: "0:0"
    entrypoint: [chown, "10001:10001", /data]
    volumes:
      - files:/data

  backend:
    image: *professy-image
    pull_policy: never
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/professy?sslMode=REQUIRED
      DB_USERNAME: professy
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JPA_DDL_AUTO: update
      APP_EVENTS_TRANSPORT: kafka
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      APP_MEDIA_DRIVER: local
      APP_MEDIA_DIRECTORY: /data/avatars
      ATTACHMENT_DIRECTORY: /data/attachments
    volumes:
      - files:/data
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully

volumes:
  mysql:
  kafka:
  files:
